# Auth模块缓存配置示例
# 在application.yaml中添加以下配置项即可切换缓存类型

# ==================== Client端配置 ====================
simple:
  auth:
    # 缓存类型配置：REDIS（Redis缓存）或 LOCAL（本地缓存）
    # 默认为REDIS，如果Redis不可用会自动切换为LOCAL
    cache-type: REDIS
    
    # 登录相关配置
    login-error-number: 5        # 登录失败次数限制
    login-error-time: 300        # 登录失败锁定时间（秒）
    
    # Token相关配置
    token-header: Authorization  # Token请求头名称
    token-prefix: Bearer         # Token前缀
    
  sign:
    # 签名缓存类型配置（可选，默认使用auth.cache-type）
    cache-type: REDIS
    # 签名有效期（秒）
    expire: 300
    
  csrf:
    # CSRF缓存类型配置（可选，默认使用auth.cache-type）
    cache-type: REDIS
    # CSRF Token有效期（秒）
    expire: 3600

# ==================== Server端配置 ====================
# Server端使用相同的配置方式，在ServerAuthConfig中自动注入CacheManager

# ==================== 缓存类型说明 ====================
# REDIS: 使用Redis作为缓存存储，适合分布式环境
# LOCAL: 使用本地Caffeine缓存，适合单机环境或开发测试

# ==================== 注意事项 ====================
# 1. 使用REDIS类型时，需要确保Redis服务可用
# 2. 使用LOCAL类型时，缓存数据仅在当前应用实例有效
# 3. 分布式部署环境建议使用REDIS类型
# 4. 开发测试环境可以使用LOCAL类型简化配置