# Auth Server模块缓存配置示例
# 在application.yaml中添加以下配置项即可切换缓存类型

# ==================== Server端配置 ====================
simple:
  auth:
    # 缓存类型配置：REDIS（Redis缓存）或 LOCAL（本地缓存）
    # 默认为REDIS，如果Redis不可用会自动切换为LOCAL
    cache-type: REDIS
    
    # 登录相关配置
    login-error-number: 5        # 登录失败次数限制
    login-error-time: 300        # 登录失败锁定时间（秒）

# ==================== 缓存类型说明 ====================
# REDIS: 使用Redis作为缓存存储，适合分布式环境
# LOCAL: 使用本地Caffeine缓存，适合单机环境或开发测试

# ==================== 注意事项 ====================
# 1. 使用REDIS类型时，需要确保Redis服务可用
# 2. 使用LOCAL类型时，缓存数据仅在当前应用实例有效
# 3. 分布式部署环境建议使用REDIS类型
# 4. 开发测试环境可以使用LOCAL类型简化配置
# 5. Server端会自动注入CacheManager，无需额外配置