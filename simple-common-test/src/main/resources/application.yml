server:
  port: 8000
#  tomcat:
#    accept-count: 100 # 等待队列，当可分配的线程数全部用完之后，后续的请求将进入等待队列等待，等待队列满后则拒绝处理，默认100
#    max-connections: 10000 # 最大可连接数，默认10000，超出后出现拒绝链接的情况
#    threads:
#      max: 200 # 最大工作线程数，默认200
#      min-spare: 10 # 最小工作线程数，初始化分配线程数，默认10
#  # undertow 配置
#  undertow:
#    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
#    max-http-post-size: -1
#    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
#    # 每块buffer的空间大小,越小的空间被利用越充分
#    buffer-size: 512
#    # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
#    threads:
#      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
#      io: 8
#      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
#      worker: 256
#
#    # 是否分配的直接内存
#    direct-buffers: true
spring:
  application:
    name: simple-common-test
  profiles:
    active: @spring.active@

  # entity时间类型数据格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss # 数据库返回时间格式化
    time-zone: GMT+8 # 时区设置

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  data:
    redis:
      database: 1
      host: develop.dev.joyswon.com
      port: 6379
      password: 12345678
      timeout: 3s
      lettuce.pool:
        max-idle: 10 # 连接池中的最大空闲连接
        min-idle: 10 # 连接池中的最小空闲连接
        max-active: 100 # 连接池的最大数据库连接数。设为0表示无限制。一般设置为并发量
        max-wait: 3000 # 从连接池中获取连接的最大等待时间（毫秒）
# doc文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '测试服务'
      paths-to-match: '/**'
      packages-to-scan: com.simple.common.test.controller