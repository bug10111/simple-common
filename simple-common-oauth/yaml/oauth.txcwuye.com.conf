server {
    server_name oauth.txcwuye.com; # 监听的目标域名
    listen 80;

    location / {
        root   /usr/share/nginx/html/oauth; # ceshi代表分包名
        index  index.html;

	# 解决刷新404问题
        try_files $uri $uri/ /index.html;
    }

	
    location /api/ {
        
		# 代理到后端
        proxy_pass   http://127.0.0.1:8000/;
        
        proxy_read_timeout 15s;  # API接口缩短超时
        proxy_buffers 4 16k;          # 减少内存占用
        proxy_busy_buffers_size 32k;
        proxy_buffering on;           # 保持小数据缓冲
			
    }	
}
