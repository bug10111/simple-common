# ==============================================
# 日志TCP服务端配置示例
# ==============================================
# 将以下配置添加到application.yml中

# 日志TCP服务端配置
log:
  tcp:
    server:
      enabled: true
      # 监听端口
      port: 9999
      # 绑定地址(0.0.0.0表示所有网卡)
      host: 0.0.0.0
      # Boss线程数(处理连接)
      boss-threads: 1
      # Worker线程数(处理IO)
      worker-threads: 4
      # 日志批量保存间隔(毫秒)
      save-interval: 5000
      # 日志批量保存数量阈值
      batch-size: 100