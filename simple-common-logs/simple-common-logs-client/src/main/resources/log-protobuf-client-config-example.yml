# Protobuf 日志客户端配置示例
# 使用 Protobuf 协议进行日志传输

log:
  tcp:
    client:
      # 是否启用 TCP 日志客户端
      enabled: true
      # 服务端地址
      host: 127.0.0.1
      # 服务端端口
      port: 8888
      # 连接超时时间（毫秒）
      connect-timeout: 5000
      # 写入超时时间（毫秒）
      write-timeout: 3000
      # 重连间隔（毫秒）
      reconnect-interval: 5000
      # 心跳间隔（毫秒）
      heartbeat-interval: 30000
      # 读空闲超时（毫秒）
      reader-idle-time: 60000