# ==============================================
# 日志TCP客户端配置示例
# ==============================================
# 将以下配置添加到application.yml中

# 日志TCP客户端配置
log:
  tcp:
    client:
      enabled: true
      # 服务端地址
      host: 127.0.0.1
      # 服务端端口
      port: 9999
      # 连接超时时间(毫秒)
      connect-timeout: 5000
      # 重连间隔(毫秒)
      reconnect-interval: 5000
      # 最大重连次数(-1表示无限重连)
      max-reconnect-attempts: -1
      # 工作线程数
      worker-threads: 4