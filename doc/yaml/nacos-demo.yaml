# ==================== 服务配置 ====================
server:
  port: ${SERVER_PORT:8080}

# ==================== Nacos 服务发现配置 ====================
spring:
  cloud:
# ==================== Sentinel 核心配置 ====================
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:192.168.200.110:8080}
        port: ${SENTINEL_CLIENT_PORT:8719}
      eager: ${SENTINEL_EAGER:true}
      metric:
        file-single-size: ${SENTINEL_FILE_SINGLE_SIZE:1073741824}  # 增大指标文件大小
      scg:
        fallback:
          response-status: ${SENTINEL_RESPONSE_STATUS:1000} # 统计精度调整
      log:
        dir: ${SENTINEL_LOG_DIR:/var/log/sentinel/}
        switch-pid: ${SENTINEL_LOG_SWITCH_PID:true}
      filter:
        enabled: ${SENTINEL_FILTER_ENABLED:true}

